[project]
name = "crm-dedup-hygiene-toolkit"
version = "0.1.0"
description = "Finds and safely merges duplicate organizations and contacts in a CRM, with a full audit trail."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crmdedup = "crmdedup.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crmdedup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
